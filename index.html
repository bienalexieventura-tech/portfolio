              <span class="text-xs uppercase tracking-widest text-zinc-400 font-semibold">LOADING ASSETS & KINETIC SHADERS</span>
              <span id="embed-intro-num" class="font-display font-extrabold text-4xl sm:text-6xl text-[#D2FF28] leading-none">0%</span>
            </div>
            <div class="w-full h-2 bg-white/10 rounded-full overflow-hidden p-0.5">
              <div id="embed-intro-bar" class="h-full bg-[#D2FF28] rounded-full" style="width: 0%"></div>
            </div>
          </div>
        </div>
      `;

      const duration = 2600;
      const startTime = performance.now();

      function tick(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const val = Math.round(eased * 100);

        const numEl = document.getElementById('embed-intro-num');
        const barEl = document.getElementById('embed-intro-bar');
        const fadeEl = document.getElementById('embed-intro-fade-text');
        if (numEl) numEl.textContent = val + '%';
        if (barEl) barEl.style.width = val + '%';
        if (fadeEl) {
          fadeEl.style.opacity = String(0.2 + (val / 100) * 0.8);
          fadeEl.style.transform = `translateY(${(1 - val / 100) * 12}px)`;
        }

        if (t < 1) {
          introRaf = requestAnimationFrame(tick);
        } else {
          setTimeout(() => {
            window.skipEmbedIntro();
          }, 420);
        }
      }

      introRaf = requestAnimationFrame(tick);
    }

    window.skipEmbedIntro = function() {
      if (introRaf) cancelAnimationFrame(introRaf);
      const curtain = document.getElementById('embed-intro-curtain');
      if (curtain) {
        curtain.style.transform = 'translateY(-100%)';
        curtain.style.opacity = '0';
      }
      setTimeout(() => {
        const root = document.getElementById('intro-curtain-root');
        if (root) root.innerHTML = '';
      }, 820);
    };

    function bindHeroParallax() {
      const heroSection = document.getElementById('top');
      const card3d = document.getElementById('hero-card-3d');
      if (!heroSection || !card3d) return;

      heroSection.addEventListener('mousemove', (e) => {
        const rect = heroSection.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width - 0.5) * 14;
        const y = -((e.clientY - rect.top) / rect.height - 0.5) * 14;
        card3d.style.transform = `perspective(1100px) rotateX(${y}deg) rotateY(${x}deg)`;
      });

      heroSection.addEventListener('mouseleave', () => {
        card3d.style.transform = 'perspective(1100px) rotateX(0deg) rotateY(0deg)';
      });
    }

              <h3 class="font-display font-extrabold text-2xl sm:text-4xl uppercase text-white mt-2 mb-4">${proj.title}</h3>
              <p class="text-zinc-300 text-sm sm:text-base leading-relaxed mb-6">${proj.summary}</p>
              <div class="flex flex-wrap gap-2">
                ${(proj.deliverables || []).map(d => `<span class="px-3 py-1 rounded-full text-xs bg-white/5 border border-white/10 text-zinc-200">${d}</span>`).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    };
    window.closeModal = function() { document.getElementById('modal-root').innerHTML = ''; };

    renderApp();
    playIntroCurtain();
  </script>
</body>
</html>
