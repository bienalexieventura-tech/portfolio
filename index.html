<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIEN ALEXIE V. VENTURA — CREATIVE DEVELOPER & UI/UX DESIGNER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #0E0E10;
      color: #F4F1EA;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    .font-display {
      font-family: 'Syne', sans-serif;
    }
    .font-serif-editorial {
      font-family: 'Instrument Serif', serif;
    }
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: max-content;
      animation: marquee 22s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }
    .bg-grid-pattern {
      background-size: 48px 48px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    }
    .clip-octagon {
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    }
    .hero-card-3d {
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
      will-change: transform;
    }
    /* LAYER 1: Solid filled metallic/white fade layer that sits BEHIND the portrait */
    .hero-knockout-solid {
      background: linear-gradient(180deg, #FFFFFF 0%, #E2E0DC 65%, rgba(226, 224, 220, 0.25) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.75));
    }
    /* LAYER 3: Crisp hollow wireframe outline + subtle inner edge fade that sits IN FRONT of the portrait */
    .hero-knockout-outline {
      color: transparent;
      -webkit-text-stroke: 2px rgba(255, 255, 255, 0.92);
      text-shadow: 0 0 24px rgba(0, 0, 0, 0.35);
    }
    /* Soft horizontal edge fade overlay for the text transition across the portrait edges */
    .hero-knockout-edge-fade {
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.25) 0%,
        rgba(255, 255, 255, 0.04) 35%,
        rgba(255, 255, 255, 0.04) 65%,
        rgba(255, 255, 255, 0.25) 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-text-fade {
      background: linear-gradient(180deg, #FFFFFF 0%, rgba(244, 241, 234, 0.92) 52%, rgba(244, 241, 234, 0.08) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }
    /* Page transition animation */
    @keyframes pageEnter {
      0% { opacity: 0; transform: translateY(14px) scale(0.992); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .page-view-enter {
      animation: pageEnter 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    /* Inline editable highlight when Edit Mode is ON */
    [contenteditable="true"] {
      user-select: text;
      outline: 1.5px dashed rgba(210, 255, 40, 0.65);
      outline-offset: 3px;
      border-radius: 4px;
      cursor: text;
      transition: outline-color 0.15s ease, background-color 0.15s ease;
    }
    [contenteditable="true"]:hover,
    [contenteditable="true"]:focus {
      outline: 2px solid #D2FF28;
      background-color: rgba(210, 255, 40, 0.08);
    }
    /* Custom thin scrollbar only for the CMS Drawer */
    .cms-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .cms-scroll::-webkit-scrollbar-track {
      background: #0E0E10;
    }
    .cms-scroll::-webkit-scrollbar-thumb {
      background: #27272A;
      border-radius: 999px;
    }
    /* Hide scrollbar while keeping element scrollable */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

    // IndexedDB helper so full-resolution PNG photos never get truncated or corrupted
    function openPortraitDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("BienPortfolioMediaDB", 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("media")) {
            db.createObjectStore("media");
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveHiResPortraitToDB(dataUrl) {
      try {
        const db = await openPortraitDB();
        const tx = db.transaction("media", "readwrite");
        tx.objectStore("media").put(dataUrl, "heroPortrait");
      } catch (e) {
        console.warn("IndexedDB save error", e);
      }
    }

    async function loadHiResPortraitFromDB() {
      try {
        const db = await openPortraitDB();
        return await new Promise((resolve) => {
          const tx = db.transaction("media", "readonly");
          const req = tx.objectStore("media").get("heroPortrait");
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    function loadSiteData() {
      try {
        localStorage.removeItem("BIEN_PORTFOLIO_CMS_V2");
        localStorage.removeItem("BIEN_PORTFOLIO_CMS_V3_COLOR");
        localStorage.removeItem("bien_portfolio_v5_color");
        localStorage.removeItem("bien_portfolio_v6_embedded_color");
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const mergedProfile = { ...DEFAULT_SITE.profile, ...(parsed.profile || {}) };
          if (!mergedProfile.portraitUrl || mergedProfile.portraitUrl === PORTRAIT_FULL_COLOR_DATA_URI) {
            mergedProfile.portraitUrl = RESTORED_PORTRAIT_URI;
          }
          mergedProfile.portraitFilter = "natural";
          return {
            ...DEFAULT_SITE,
            ...parsed,
            profile: mergedProfile,
            sectionHeaders: { ...DEFAULT_SITE.sectionHeaders, ...(parsed.sectionHeaders || {}) }
          };
        }
      } catch (e) {
        console.warn("Could not read saved site data", e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_SITE));
    }

    function getShapeStyle(shape) {

      if (shape === 'pill') return 'border-radius: 999px;';
      if (shape === 'brutalist') return 'border-radius: 0px;';
      return 'border-radius: 32px;';
    }

    function getFilterStyle(filter) {
      if (filter === 'editorial-bw') return 'filter: grayscale(100%) contrast(1.18) brightness(0.96);';
      if (filter === 'high-contrast') return 'filter: contrast(1.28) saturate(1.15);';
      if (filter === 'lime-duotone') return 'filter: grayscale(100%) sepia(80%) hue-rotate(38deg) saturate(350%) contrast(1.15);';
      return 'filter: none !important;';
    }

      const duration = 2400;
      const startTime = performance.now();

      function tick(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const val = Math.round(eased * 100);

        const numEl = document.getElementById('embed-intro-num');
        const barEl = document.getElementById('embed-intro-bar');
        const fadeEl = document.getElementById('embed-intro-fade-text');
        if (numEl) numEl.textContent = val + '%';
        if (barEl) barEl.style.width = val + '%';
        if (fadeEl) {
          fadeEl.style.opacity = String(0.2 + (val / 100) * 0.8);
          fadeEl.style.transform = `translateY(${(1 - val / 100) * 12}px)`;
        }

        if (t < 1) {
          introRaf = requestAnimationFrame(tick);
        } else {
          setTimeout(() => {
            window.skipEmbedIntro();
          }, 380);
        }
      }

      introRaf = requestAnimationFrame(tick);
    }

    window.skipEmbedIntro = function() {
      if (introRaf) cancelAnimationFrame(introRaf);

        curtain.style.opacity = '0';

    function bindHeroParallax() {
      const heroSection = document.getElementById('hero-stage');
      const card3d = document.getElementById('hero-card-3d');
      if (!heroSection || !card3d) return;

      heroSection.addEventListener('mousemove', (e) => {
        const rect = heroSection.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width - 0.5) * 12;
        const y = -((e.clientY - rect.top) / rect.height - 0.5) * 12;
        card3d.style.transform = `perspective(1100px) rotateX(${y}deg) rotateY(${x}deg)`;
      });

      heroSection.addEventListener('mouseleave', () => {
        card3d.style.transform = 'perspective(1100px) rotateX(0deg) rotateY(0deg)';
      });
    }

              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold uppercase text-[#D2FF28]">Experience Timeline</span>
                <button onclick="addExperienceItem()" class="px-2.5 py-1 rounded bg-[#D2FF28] text-[#0E0E10] text-[10px] font-extrabold uppercase cursor-pointer">+ Add Role</button>
              </div>
              ${SITE.experience.map((e, idx) => `
                <div class="p-2.5 rounded-xl bg-[#0E0E10] border border-white/10 space-y-1.5">
                  <div class="flex items-center justify-between gap-2">
                    <input value="${e.role}" oninput="updateArrayItem('experience', ${idx}, 'role', this.value)" placeholder="Role" class="flex-1 px-2 py-1 rounded bg-[#16161A] border border-white/10 text-xs font-bold text-white" />
                    <button onclick="removeArrayItem('experience', ${idx})" class="px-2 py-1 rounded bg-red-500/20 text-red-400 text-[10px] cursor-pointer">Delete</button>
                  </div>
                  <div class="grid grid-cols-2 gap-1.5">
                    <input value="${e.company}" oninput="updateArrayItem('experience', ${idx}, 'company', this.value)" placeholder="Company" class="px-2 py-1 rounded bg-[#16161A] border border-white/10 text-[11px] text-zinc-300" />
                    <input value="${e.period}" oninput="updateArrayItem('experience', ${idx}, 'period', this.value)" placeholder="Period" class="px-2 py-1 rounded bg-[#16161A] border border-white/10 text-[11px] text-[#D2FF28]" />
                  </div>
                  <input value="${e.highlight}" oninput="updateArrayItem('experience', ${idx}, 'highlight', this.value)" placeholder="Highlight" class="w-full px-2 py-1 rounded bg-[#16161A] border border-white/10 text-[11px] text-zinc-400" />
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (cmsTab === 'reviews') {
        tabBody = `
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold uppercase text-[#D2FF28]">Client Reviews (${SITE.testimonials.length})</span>
              <button onclick="addTestimonialItem()" class="px-3 py-1 rounded-lg bg-[#D2FF28] text-[#0E0E10] text-[10px] font-extrabold uppercase cursor-pointer">+ Add Review</button>
            </div>
            ${SITE.testimonials.map((t, idx) => `
              <div class="p-3 rounded-xl bg-[#0E0E10] border border-white/10 space-y-2">
                <div class="flex items-center justify-between gap-2">
                  <input value="${t.author}" oninput="updateArrayItem('testimonials', ${idx}, 'author', this.value)" placeholder="Client Name" class="flex-1 px-2 py-1 rounded bg-[#16161A] border border-white/10 text-xs font-bold text-white" />
                  <button onclick="removeArrayItem('testimonials', ${idx})" class="px-2 py-1 rounded bg-red-500/20 text-red-400 text-[10px] cursor-pointer">Delete</button>
                </div>
                <input value="${t.role}" oninput="updateArrayItem('testimonials', ${idx}, 'role', this.value)" placeholder="Role & Company" class="w-full px-2 py-1 rounded bg-[#16161A] border border-white/10 text-[11px] text-zinc-400" />
                <textarea rows="3" oninput="updateArrayItem('testimonials', ${idx}, 'quote', this.value)" class="w-full px-2 py-1 rounded bg-[#16161A] border border-white/10 text-xs text-zinc-200">${t.quote}</textarea>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        tabBody = `
          <div class="space-y-3">
            <div>
              <label class="text-[10px] font-bold uppercase tracking-wider text-zinc-400">Contact Heading</label>
              <input value="${sh.contactTitle}" oninput="updateHeaderField('contactTitle', this.value)" class="w-full mt-1 px-3 py-2 rounded-lg bg-[#0E0E10] border border-white/15 text-xs text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold uppercase tracking-wider text-zinc-400">Direct Email Address</label>
              <input value="${p.email}" oninput="updateProfileField('email', this.value)" class="w-full mt-1 px-3 py-2 rounded-lg bg-[#0E0E10] border border-white/15 text-xs text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold uppercase tracking-wider text-zinc-400">Inquiry Card Title</label>
              <input value="${sh.inquiryTitle}" oninput="updateHeaderField('inquiryTitle', this.value)" class="w-full mt-1 px-3 py-2 rounded-lg bg-[#0E0E10] border border-white/15 text-xs text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold uppercase tracking-wider text-zinc-400">Submit Button Label</label>
              <input value="${sh.inquiryBtn}" oninput="updateHeaderField('inquiryBtn', this.value)" class="w-full mt-1 px-3 py-2 rounded-lg bg-[#0E0E10] border border-white/15 text-xs text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold uppercase tracking-wider text-zinc-400">Footer Copyright</label>
              <input value="${sh.footerText}" oninput="updateHeaderField('footerText', this.value)" class="w-full mt-1 px-3 py-2 rounded-lg bg-[#0E0E10] border border-white/15 text-xs text-white" />
            </div>
          </div>
        `;
      }

      root.innerHTML = `
        <aside class="allow-inner-scroll fixed top-16 right-4 bottom-12 z-50 w-[350px] sm:w-[400px] rounded-3xl bg-[#16161A]/95 backdrop-blur-2xl border border-white/20 shadow-[0_25px_80px_rgba(0,0,0,0.9)] flex flex-col overflow-hidden">
          <div class="p-4 border-b border-white/10 flex items-center justify-between">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-widest text-[#D2FF28] block">// STUDIO CMS EDITOR</span>
              <h4 class="font-display font-extrabold text-sm uppercase text-white">Edit All Pages & Content</h4>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="downloadStandaloneHTML()" class="px-2.5 py-1 rounded-lg bg-[#D2FF28] text-[#0E0E10] text-[10px] font-extrabold uppercase cursor-pointer">Export HTML</button>
              <button onclick="resetAllSiteData()" class="px-2 py-1 rounded-lg bg-white/5 hover:bg-red-500/20 text-zinc-400 hover:text-red-300 text-[10px] font-bold uppercase cursor-pointer">Reset</button>
              <button onclick="toggleCMSDrawer(false)" class="w-7 h-7 rounded-full bg-white/10 text-white text-xs font-bold cursor-pointer">✕</button>
            </div>
          </div>

          <!-- CMS Page Tabs -->
          <div class="px-3 py-2 border-b border-white/10 flex flex-wrap gap-1 bg-[#0E0E10]/60">
            ${tabs.map(t => `
              <button
                onclick="cmsTab='${t.id}';navigateTo('${t.id}');"
                class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase cursor-pointer transition-all ${
                  cmsTab === t.id ? 'bg-[#D2FF28] text-[#0E0E10]' : 'bg-white/5 text-zinc-400 hover:text-white'
                }"
              >
                ${t.label}
              </button>
            `).join('')}
          </div>

          <!-- Scrollable CMS Form Body -->
          <div class="cms-scroll allow-inner-scroll flex-1 overflow-y-auto p-4">
            ${tabBody}
          </div>
        </aside>
      `;
    }

    // CMS State Mutators
    window.updateProfileField = function(key, val) {
      SITE.profile[key] = val;
      saveSiteData();
      renderApp();
    };

    window.updateHeaderField = function(key, val) {
      SITE.sectionHeaders[key] = val;
      saveSiteData();
      renderApp();
    };

    window.updateArrayItem = function(arrKey, idx, field, val) {
      if (SITE[arrKey] && SITE[arrKey][idx]) {
        SITE[arrKey][idx][field] = val;
        saveSiteData();
        renderApp();
      }
    };

    window.updateArrayTags = function(arrKey, idx, field, rawVal) {
      if (SITE[arrKey] && SITE[arrKey][idx]) {
        SITE[arrKey][idx][field] = rawVal.split(',').map(s => s.trim()).filter(Boolean);
        saveSiteData();
        renderApp();
      }
    };

    window.removeArrayItem = function(arrKey, idx) {
      SITE[arrKey].splice(idx, 1);
      if (arrKey === 'services' && activeServiceIdx >= SITE.services.length) {
        activeServiceIdx = Math.max(0, SITE.services.length - 1);
      }
      saveSiteData();
      renderApp();
      renderCMSDrawer();
    };

    window.addServiceItem = function() {
      const nextNum = String(SITE.services.length + 1).padStart(2, '0');
      SITE.services.push({
        id: nextNum,
        title: "NEW CAPABILITY",
        description: "Click to edit this capability description and tags.",
        tags: ["Design", "Architecture"],
        previewImg: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=800&q=80"
      });
      activeServiceIdx = SITE.services.length - 1;
      saveSiteData();
      renderApp();
      renderCMSDrawer();
    };

    window.addProjectItem = function() {
      SITE.projects.push({
        id: Date.now(),
        title: "NEW PROJECT CASE STUDY",
        category: "UI/UX & WebGL",
        year: "2026",
        client: "Client Partner",
        metrics: "Featured Launch",
        image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=85",
        summary: "Describe the project architecture, visual direction, and impact.",
        deliverables: ["Design System", "Frontend"]
      });
      saveSiteData();
      renderApp();
      renderCMSDrawer();
    };

    window.addMetricItem = function() {
      SITE.metrics.push({ num: "100%", label: "New Key Metric" });
      saveSiteData();
      renderApp();
      renderCMSDrawer();
    };

    window.addExperienceItem = function() {
      SITE.experience.push({
        role: "Creative Technologist",
        company: "Studio / Brand",
        period: "2025 — PRESENT",
        highlight: "Key impact and shipped products"
      });
      saveSiteData();
      renderApp();
      renderCMSDrawer();
    };

    window.addTestimonialItem = function() {
      SITE.testimonials.push({
        quote: "An extraordinary partner for high-impact digital experiences.",
        author: "ALEXANDER CHEN",
        role: "Product Lead"
      });
      saveSiteData();
      renderApp();
      renderCMSDrawer();
    };

    window.uploadImageToField = function(inputEl, path) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(evt) {
        const dataUrl = evt.target.result;
        const parts = path.split('.');
        SITE[parts[0]][parts[1]] = dataUrl;
        if (path === 'profile.portraitUrl') {
          RESTORED_PORTRAIT_URI = dataUrl;
          await saveHiResPortraitToDB(dataUrl);
        }
        saveSiteData();
        renderApp();
        renderCMSDrawer();
      };
      reader.readAsDataURL(file);
    };

    // Allow pasting the original image from clipboard (Ctrl+V) anywhere on the site
    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData || {}).items || [];
      for (const item of items) {
        if (item.type && item.type.indexOf('image') === 0) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = async (evt) => {
            const dataUrl = evt.target.result;
            RESTORED_PORTRAIT_URI = dataUrl;
            SITE.profile.portraitUrl = dataUrl;
            await saveHiResPortraitToDB(dataUrl);
            saveSiteData();
            renderApp();
            renderCMSDrawer();
          };
          reader.readAsDataURL(blob);
          break;
        }
      }
    });

    window.uploadImageToArray = function(inputEl, arrKey, idx, field) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        if (SITE[arrKey] && SITE[arrKey][idx]) {
          SITE[arrKey][idx][field] = evt.target.result;
          saveSiteData();
          renderApp();
          renderCMSDrawer();
        }
      };
      reader.readAsDataURL(file);
    };

    window.resetAllSiteData = async function() {
      localStorage.removeItem(STORAGE_KEY);
      try {
        const db = await openPortraitDB();
        const tx = db.transaction("media", "readwrite");
        tx.objectStore("media").delete("heroPortrait");
      } catch (e) {}
      RESTORED_PORTRAIT_URI = await buildCleanRestoredPortrait();
      SITE = JSON.parse(JSON.stringify(DEFAULT_SITE));
      SITE.profile.portraitUrl = RESTORED_PORTRAIT_URI;
      saveSiteData();
      renderApp();
      renderCMSDrawer();
    };

    window.downloadStandaloneHTML = function() {
      const htmlClone = document.documentElement.outerHTML.replace(
        /const DEFAULT_SITE = \{[\s\S]*?\};\s*const STORAGE_KEY/,
        `const DEFAULT_SITE = ${JSON.stringify(SITE, null, 2)};\n    const STORAGE_KEY`
      );
      const blob = new Blob(['<!DOCTYPE html>\n' + htmlClone], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bien-ventura-portfolio.html';
      a.click();
      URL.revokeObjectURL(url);
    };

    window.selectService = function(idx) { activeServiceIdx = idx; renderApp(); };
    window.filterCategory = function(cat) { currentCategory = cat; renderApp(); };
    window.openProject = function(id) {
      const projIdx = SITE.projects.findIndex(x => x.id === id);
      const proj = SITE.projects[projIdx];
      if (!proj) return;
      document.getElementById('modal-root').innerHTML = `
        <div onclick="closeModal()" class="allow-inner-scroll fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div onclick="event.stopPropagation()" class="w-full max-w-3xl rounded-3xl bg-[#16161A] border border-white/15 overflow-hidden shadow-2xl">
            <div class="relative aspect-[16/9] bg-black">
              <img src="${proj.image}" class="w-full h-full object-cover" />
              <button onclick="closeModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-black/80 text-white font-bold cursor-pointer">✕</button>
            </div>
            <div class="p-6 sm:p-8">
              <span class="text-xs font-extrabold uppercase text-[#D2FF28]">
                <span ${editAttr(`projects.${projIdx}.category`)}>${proj.category}</span> •
                <span ${editAttr(`projects.${projIdx}.year`)}>${proj.year}</span> •
                <span ${editAttr(`projects.${projIdx}.metrics`)}>${proj.metrics}</span>
              </span>
              <h3 ${editAttr(`projects.${projIdx}.title`)} class="font-display font-extrabold text-2xl sm:text-4xl uppercase text-white mt-2 mb-4">${proj.title}</h3>
              <p ${editAttr(`projects.${projIdx}.summary`)} class="text-zinc-300 text-sm sm:text-base leading-relaxed mb-6">${proj.summary}</p>
              <div class="flex flex-wrap gap-2">
                ${(proj.deliverables || []).map((d, dIdx) => `<span ${editAttr(`projects.${projIdx}.deliverables.${dIdx}`)} class="px-3 py-1 rounded-full text-xs bg-white/5 border border-white/10 text-zinc-200">${d}</span>`).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    };
    window.closeModal = function() { document.getElementById('modal-root').innerHTML = ''; };

    // Initialize clean portrait restoration + IndexedDB high-res check before rendering
    (async function initPortfolio() {
      const savedHiRes = await loadHiResPortraitFromDB();
      if (savedHiRes) {
        RESTORED_PORTRAIT_URI = savedHiRes;
      } else {
        RESTORED_PORTRAIT_URI = await buildCleanRestoredPortrait();
      }
      SITE.profile.portraitUrl = RESTORED_PORTRAIT_URI;
      renderApp();
      playIntroCurtain();
    })();
  </script>
</body>
</html>
