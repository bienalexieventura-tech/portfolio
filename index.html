<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIEN ALEXIE V. VENTURA — CREATIVE DEVELOPER & UI/UX DESIGNER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100vh; width: 100vw; overflow: hidden; background: #15171B; color: #E8EDF7; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; user-select: none; }
    .font-display { font-family: 'Syne', sans-serif; }
    .font-serif-editorial { font-family: 'Instrument Serif', serif; }
    @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
    .animate-marquee { display: flex; width: max-content; animation: marquee 22s linear infinite; }
    .animate-marquee:hover { animation-play-state: paused; }
    .bg-grid-pattern {
      background-size: auto, auto, 48px 48px, 48px 48px;
      background-image:
        radial-gradient(ellipse 70% 60% at 12% 0%, rgba(30, 63, 143, 0.34), transparent 60%),
        radial-gradient(ellipse 60% 50% at 96% 100%, rgba(19, 41, 92, 0.5), transparent 60%),
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    }
    .clip-octagon { clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%); }
    .hero-card-3d { transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1); transform-style: preserve-3d; will-change: transform; }
    /* LAYER 1: solid metallic fill BEHIND the portrait */
    .hero-knockout-solid {
      background: linear-gradient(180deg, #FFFFFF 0%, #C9D3E8 65%, rgba(201, 211, 232, 0.25) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent;
      filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.75));
    }
    /* LAYER 3: hollow outline IN FRONT of the portrait */
    .hero-knockout-outline { color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, 0.92); text-shadow: 0 0 24px rgba(0, 0, 0, 0.35); }
    .hero-knockout-edge-fade {
      background: linear-gradient(90deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.04) 35%, rgba(255,255,255,0.04) 65%, rgba(255,255,255,0.25) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero-text-fade {
      background: linear-gradient(180deg, #FFFFFF 0%, rgba(232, 237, 247, 0.92) 52%, rgba(232, 237, 247, 0.08) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent;
    }
    @keyframes pageEnter { 0% { opacity: 0; transform: translateY(14px) scale(0.992); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    .page-view-enter { animation: pageEnter 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    [contenteditable="true"] { user-select: text; outline: 1.5px dashed rgba(79, 125, 243, 0.65); outline-offset: 3px; border-radius: 4px; cursor: text; transition: outline-color 0.15s ease, background-color 0.15s ease; }
    [contenteditable="true"]:hover, [contenteditable="true"]:focus { outline: 2px solid #4F7DF3; background-color: rgba(79, 125, 243, 0.08); }
    .cms-scroll::-webkit-scrollbar { width: 6px; }
    .cms-scroll::-webkit-scrollbar-track { background: #15171B; }
    .cms-scroll::-webkit-scrollbar-thumb { background: #27272A; border-radius: 999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ===== Circle-logo intro ===== */
    #embed-intro-curtain { --pc: clamp(220px, 38vmin, 380px); }
    @keyframes pcDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes pcSpin { to { transform: rotate(360deg); } }
    @keyframes pcSpinRev { to { transform: rotate(-360deg); } }
    @keyframes pcPop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes pcPing { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(2.7); opacity: 0; } }
    @keyframes pcFromLeft { from { opacity: 0; transform: translateX(-46px); filter: blur(10px); } to { opacity: 1; transform: translateX(0); filter: blur(0); } }
    @keyframes pcFromRight { from { opacity: 0; transform: translateX(46px); filter: blur(10px); } to { opacity: 1; transform: translateX(0); filter: blur(0); } }
    @keyframes pcLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pcRise { from { transform: translateY(115%); } to { transform: translateY(0); } }
    @keyframes pcFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pcShine { from { transform: translateX(-160%) skewX(-22deg); } to { transform: translateX(260%) skewX(-22deg); } }
    .pc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: pcDraw 1.5s cubic-bezier(0.65, 0, 0.35, 1) 0.2s forwards; }
    .pc-spin { transform-origin: 100px 100px; animation: pcSpin 14s linear infinite; }
    .pc-spin-rev { transform-origin: 100px 100px; animation: pcSpinRev 4.5s linear infinite; }
    .pc-pop { opacity: 0; animation: pcPop 0.9s cubic-bezier(0.34, 1.4, 0.64, 1) 0.9s forwards; }
    .pc-ping { opacity: 0; animation: pcPing 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .pc-b { opacity: 0; animation: pcFromLeft 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.5s forwards; }
    .pc-v { opacity: 0; animation: pcFromRight 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.65s forwards; }
    .pc-shine { animation: pcShine 1.4s ease-in-out 2.3s 1 both; }
    .pc-line { transform: scaleX(0); animation: pcLine 1.1s cubic-bezier(0.76, 0, 0.24, 1) 1.9s forwards; }
    .pc-rise { transform: translateY(115%); animation: pcRise 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .pc-fade { opacity: 0; animation: pcFade 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  </style>  </style>

        const val = Math.round(eased * 100);
        const numEl = document.getElementById('embed-intro-num');
        const barEl = document.getElementById('embed-intro-bar');
        if (numEl) numEl.textContent = val + '%';
        if (barEl) barEl.style.width = val + '%';
        if (t < 1) introRaf = requestAnimationFrame(tick);
        else introTimers.push(setTimeout(() => window.skipEmbedIntro(), 400));
      }
      introRaf = requestAnimationFrame(tick);

        stage.style.opacity = '0';

        card3d.style.transform = `perspective(1100px) rotateX(${y}deg) rotateY(${x}deg)`;

      heroSection.addEventListener('mouseleave', () => {

                <span class="text-xs font-bold uppercase tracking-widest text-[#4F7DF3] block mb-1">${sh.reviewsLabel}</span>
                <h2 class="font-display font-extrabold text-3xl sm:text-5xl uppercase">
                  <span>${sh.reviewsTitle}</span>
                  <span class="font-serif-editorial italic font-normal text-[#4F7DF3] lowercase">${sh.reviewsAccent}</span>
                </h2>
              </div>
              
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              ${SITE.testimonials.map((t, idx) => `
                <div class="p-6 sm:p-8 rounded-3xl bg-[#1D2026] border border-white/10 flex flex-col justify-between">
                  <p class="text-base sm:text-xl text-zinc-200 leading-relaxed mb-6">"${t.quote}"</p>
                  <div class="pt-4 border-t border-white/10">
                    <div class="font-display font-extrabold text-sm uppercase text-white">${t.author}</div>
                    <div class="text-xs text-zinc-400">${t.role}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }

      // Contact page
      return `
        <section class="page-view-enter flex-1 flex flex-col justify-center px-4 sm:px-8 py-4 max-w-7xl w-full mx-auto overflow-hidden">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
            <div class="lg:col-span-7">
              <span class="text-xs font-bold uppercase tracking-widest text-[#4F7DF3] block mb-3">${sh.contactLabel}</span>
              <h2 class="font-display font-extrabold text-4xl sm:text-6xl uppercase tracking-tighter leading-none mb-6">${sh.contactTitle}</h2>
              <a href="mailto:${p.email}" style="background:${p.accentColor}" class="inline-flex items-center gap-3 px-7 py-4 rounded-2xl text-[#15171B] font-display font-extrabold text-base sm:text-lg uppercase tracking-wider shadow-xl hover:scale-105 transition-transform">
                <span>${p.email}</span> ↗
              </a>
              <p class="mt-8 text-xs text-zinc-500 uppercase tracking-widest">${sh.footerText}</p>
            </div>
            <div class="lg:col-span-5 p-6 sm:p-7 rounded-3xl bg-[#1D2026] border border-white/10">
              <h3 class="font-display font-extrabold text-xl uppercase mb-4">${sh.inquiryTitle}</h3>
              <form onsubmit="event.preventDefault(); this.innerHTML='<div class=\'p-6 rounded-2xl bg-[#4F7DF3]/15 border border-[#4F7DF3] text-center\'><p class=\'font-display font-extrabold text-xl text-[#4F7DF3] uppercase mb-2\'>Inquiry Received ✓</p><p class=\'text-xs text-zinc-300\'>Thank you! We will respond within 24 hours.</p></div>';" class="space-y-3">
                <input required placeholder="Your Name" class="w-full px-4 py-2.5 rounded-xl bg-[#15171B] border border-white/10 text-sm text-white focus:border-[#4F7DF3] focus:outline-none" />
                <input required type="email" placeholder="Your Email" class="w-full px-4 py-2.5 rounded-xl bg-[#15171B] border border-white/10 text-sm text-white focus:border-[#4F7DF3] focus:outline-none" />
                <textarea required rows="3" placeholder="Project details, timeline & goals..." class="w-full px-4 py-2.5 rounded-xl bg-[#15171B] border border-white/10 text-sm text-white focus:border-[#4F7DF3] focus:outline-none"></textarea>
                <button type="submit" style="background:${p.accentColor}" class="w-full py-3.5 rounded-xl text-[#15171B] font-display font-extrabold text-xs uppercase tracking-wider cursor-pointer hover:brightness-110 transition-all">
                  <span>${sh.inquiryBtn}</span>
                </button>
              </form>
            </div>
          </div>
        </section>
      `;
    }

    function renderApp() {
      p = SITE.profile;
      sh = SITE.sectionHeaders;

      const navItems = [
        { id: 'home', label: 'Home' },
        { id: 'services', label: 'About Me' },
        { id: 'work', label: 'My Achievements' },
        { id: 'about', label: 'My Parents/Family' },
        { id: 'reviews', label: 'Reviews' },
        { id: 'contact', label: 'Contact' }
      ];

      document.getElementById('portfolio-root').innerHTML = `
        <header class="z-40 backdrop-blur-xl bg-[#15171B]/95 border-b border-white/10 shrink-0">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap xl:flex-nowrap items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0 shrink-0">
              <button onclick="navigateTo('home')" class="font-display font-extrabold text-xs sm:text-sm tracking-wider uppercase text-[#E8EDF7] flex items-center gap-2 group whitespace-nowrap cursor-pointer bg-transparent border-0 p-0">
                <span class="group-hover:text-[#4F7DF3] transition-colors">${p.fullName || 'BIEN ALEXIE V. VENTURA'}</span>
                <span style="background:${p.accentColor}" class="w-2.5 h-2.5 rounded-full inline-block shrink-0 group-hover:scale-125 transition-transform"></span>
              </button>
              <button onclick="playIntroCurtain()" class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-widest bg-[#1D2026] hover:bg-white/10 border border-white/10 text-zinc-300 transition-colors cursor-pointer whitespace-nowrap">
                <span class="text-[#4F7DF3] text-[9px]">▶</span> REPLAY INTRO
              </button>
            </div>

            <nav onwheel="this.scrollLeft += event.deltaY" class="no-scrollbar allow-inner-scroll flex items-center gap-1 px-1.5 py-1 rounded-full bg-[#1A1D22] border border-white/10 overflow-x-auto max-w-full">
              ${navItems.map(item => `
                <button onclick="navigateTo('${item.id}')" class="px-2.5 sm:px-3 py-1.5 rounded-full text-[10px] sm:text-[11px] font-bold uppercase tracking-widest transition-all cursor-pointer whitespace-nowrap ${currentPage === item.id ? 'bg-[#4F7DF3] text-[#15171B] shadow-sm' : 'text-zinc-300 hover:bg-white/5 hover:text-white'}">${item.label}</button>
              `).join('')}
            </nav>

            <div class="flex items-center gap-2 shrink-0">
              <button onclick="navigateTo('contact')" style="background:${p.accentColor}" class="px-4 py-1.5 rounded-full text-[10px] sm:text-[11px] font-extrabold uppercase tracking-wider text-[#15171B] hover:scale-105 transition-transform shadow-[0_0_25px_rgba(79, 125, 243,0.3)] whitespace-nowrap cursor-pointer">LET'S TALK ↗</button>
            </div>
          </div>
        </header>

        <main class="flex-1 flex flex-col justify-between overflow-hidden min-h-0">
          ${renderActivePageContent()}
        </main>

        <footer class="z-30 shrink-0">
          <div style="background:${p.accentColor}" class="py-2 border-y border-[#15171B] text-[#15171B] overflow-hidden shadow-lg">
            <div class="animate-marquee flex items-center">
              ${Array(8).fill(`<span class="font-display font-extrabold text-[11px] sm:text-xs uppercase tracking-wider mx-6 flex items-center gap-3">${sh.marqueeText}</span>`).join('')}
            </div>
          </div>
          <div class="bg-[#101216] border-t border-white/10 px-4 sm:px-8 py-2 flex items-center justify-between text-[11px]">
            <div class="flex items-center gap-2">
              <span class="text-zinc-500 font-bold uppercase tracking-widest">PAGE ${PAGES.indexOf(currentPage) + 1} / ${PAGES.length}</span>
              <span class="text-[#4F7DF3] font-extrabold uppercase tracking-widest">// ${currentPage.toUpperCase()}</span>
              
            </div>
            <div class="flex items-center gap-2">
              
              <button onclick="stepPage(-1)" class="px-3 py-1 rounded-full bg-[#1D2026] hover:bg-[#4F7DF3] hover:text-[#15171B] border border-white/10 text-zinc-300 font-bold uppercase tracking-wider transition-colors cursor-pointer">← Prev Page</button>
              <button onclick="stepPage(1)" class="px-3 py-1 rounded-full bg-[#1D2026] hover:bg-[#4F7DF3] hover:text-[#15171B] border border-white/10 text-zinc-300 font-bold uppercase tracking-wider transition-colors cursor-pointer">Next Page →</button>
            </div>
          </div>
        </footer>
      `;

      if (currentPage === 'home') bindHeroParallax();
    }

    window.selectService = function(idx) { activeServiceIdx = idx; renderApp(); };
    window.filterCategory = function(cat) { currentCategory = cat; renderApp(); };
    window.openProject = function(id) {
      const projIdx = SITE.projects.findIndex(x => x.id === id);
      const proj = SITE.projects[projIdx];
      if (!proj) return;
      document.getElementById('modal-root').innerHTML = `
        <div onclick="closeModal()" class="allow-inner-scroll fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div onclick="event.stopPropagation()" class="w-full max-w-3xl rounded-3xl bg-[#1D2026] border border-white/15 overflow-hidden shadow-2xl">
            <div class="relative aspect-[16/9] bg-black">
              <img src="${proj.image}" class="w-full h-full object-cover" />
              <button onclick="closeModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-black/80 text-white font-bold cursor-pointer">✕</button>
            </div>
            <div class="p-6 sm:p-8">
              <span class="text-xs font-extrabold uppercase text-[#4F7DF3]">
                <span>${proj.category}</span> •
                <span>${proj.year}</span> •
                <span>${proj.metrics}</span>
              </span>
              <h3 class="font-display font-extrabold text-2xl sm:text-4xl uppercase text-white mt-2 mb-4">${proj.title}</h3>
              <p class="text-zinc-300 text-sm sm:text-base leading-relaxed mb-6">${proj.summary}</p>
              <div class="flex flex-wrap gap-2">
                ${(proj.deliverables || []).map((d, dIdx) => `<span class="px-3 py-1 rounded-full text-xs bg-white/5 border border-white/10 text-zinc-200">${d}</span>`).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    };
    window.closeModal = function() { document.getElementById('modal-root').innerHTML = ''; };

    // Start
    SITE.profile.portraitUrl = SITE.profile.portraitUrl || PORTRAIT_FULL_COLOR_DATA_URI;
    renderApp();
    playIntroCurtain();
  </script>
</body>
</html>
