      const duration = 5000;
      const startTime = performance.now();

      function tick(now) {
        const tt = Math.min(1, (now - startTime) / duration);
        const eased = tt < 0.5 ? 4 * tt * tt * tt : 1 - Math.pow(-2 * tt + 2, 3) / 2;
        const val = Math.round(eased * 100);
        const numEl = document.getElementById('embed-intro-num');
        const barEl = document.getElementById('embed-intro-bar');
        if (numEl) numEl.textContent = val + '%';
        if (barEl) barEl.style.width = val + '%';
        if (tt < 1) introRaf = requestAnimationFrame(tick);
        else introTimers.push(setTimeout(() => window.skipEmbedIntro(), 400));
      }
      introRaf = requestAnimationFrame(tick);
    }

    // Flowing gold silk background
    function initBgFx() {
      const c = document.getElementById('bg-canvas');
      if (!c) return;
      const ctx = c.getContext('2d');
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w = 0, h = 0, dpr = 1, grads = [];
      const mouse = { x: 0.5, y: 0.35, tx: 0.5, ty: 0.35 };
      const bundles = [
        { y: 0.30, amp: 0.085, freq: 1.35, speed: 0.00032, lines: 36, spread: 0.20, alpha: 0.42, color: '232,196,90', seed: 0.0 },
        { y: 0.74, amp: 0.10, freq: 1.10, speed: -0.00026, lines: 36, spread: 0.24, alpha: 0.36, color: '212,175,55', seed: 2.1 },
        { y: 0.52, amp: 0.06, freq: 2.10, speed: 0.00042, lines: 22, spread: 0.12, alpha: 0.16, color: '255,255,255', seed: 4.2 }
      ];
      const stars = Array.from({ length: 46 }, () => ({
        x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + 0.5,
        vx: (Math.random() * 0.6 + 0.2) * 0.00006, tw: Math.random() * 0.0016 + 0.0005,
        p: Math.random() * 6.283, gold: Math.random() < 0.75
      }));
      function size() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = c.width = Math.floor(window.innerWidth * dpr);
        h = c.height = Math.floor(window.innerHeight * dpr);
        c.style.width = window.innerWidth + 'px';
        c.style.height = window.innerHeight + 'px';
        grads = bundles.map(b => {
          const g = ctx.createLinearGradient(0, 0, w, 0);
          g.addColorStop(0, 'rgba(' + b.color + ',0)');
          g.addColorStop(0.2, 'rgba(' + b.color + ',1)');
          g.addColorStop(0.8, 'rgba(' + b.color + ',1)');
          g.addColorStop(1, 'rgba(' + b.color + ',0)');
          return g;
        });
      }
      size();
      window.addEventListener('resize', size);
      window.addEventListener('mousemove', (e) => {
        mouse.tx = e.clientX / window.innerWidth;
        mouse.ty = e.clientY / window.innerHeight;
      });
      function frame(now) {
        const t = reduce ? 0 : (now || 0);
        mouse.x += (mouse.tx - mouse.x) * 0.04;
        mouse.y += (mouse.ty - mouse.y) * 0.04;
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.clearRect(0, 0, w, h);
        // soft golden spotlight that follows the cursor
        const R = Math.max(w, h) * 0.38;
        const sg = ctx.createRadialGradient(mouse.x * w, mouse.y * h, 0, mouse.x * w, mouse.y * h, R);
        sg.addColorStop(0, 'rgba(212,175,55,0.17)');
        sg.addColorStop(0.5, 'rgba(212,175,55,0.05)');
        sg.addColorStop(1, 'rgba(212,175,55,0)');
        ctx.fillStyle = sg;
        ctx.fillRect(0, 0, w, h);
        // flowing silk-thread ribbons
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineWidth = 1 * dpr;
        const step = Math.max(8 * dpr, w / 160);
        for (let bi = 0; bi < bundles.length; bi++) {
          const b = bundles[bi];
          ctx.strokeStyle = grads[bi];
          const base = (b.y + (mouse.y - 0.5) * 0.05) * h;
          for (let i = 0; i < b.lines; i++) {
            const k = i / (b.lines - 1);
            ctx.globalAlpha = b.alpha * (0.25 + 0.75 * Math.sin(k * Math.PI));
            ctx.beginPath();
            for (let x = 0; x <= w + step; x += step) {
              const nx = x / w;
              const twist = 0.55 + 0.45 * Math.sin(nx * 3.2 + t * 0.00031 + b.seed);
              const y = base + (k - 0.5) * b.spread * h * twist
                + Math.sin(nx * b.freq * 6.283 + t * b.speed + b.seed + k * 1.1) * b.amp * h
                + Math.sin(nx * b.freq * 2.3 * 6.283 - t * b.speed * 1.4 + k * 0.7) * b.amp * h * 0.3;
              if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
          }
        }
        // twinkling gold dust
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          if (!reduce) { s.x += s.vx * 16; if (s.x > 1.02) s.x = -0.02; }
          const a = 0.2 + 0.6 * Math.abs(Math.sin(t * s.tw + s.p));
          ctx.globalAlpha = 1;
          ctx.fillStyle = s.gold ? 'rgba(240,217,138,' + a + ')' : 'rgba(255,255,255,' + (a * 0.7) + ')';
          ctx.beginPath();
          ctx.arc(s.x * w, s.y * h, s.r * dpr, 0, 6.283);
          ctx.fill();
        }
        if (!reduce) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function bindHeroParallax() {
      const heroSection = document.getElementById('hero-stage');
      const card3d = document.getElementById('hero-card-3d');
      if (!heroSection || !card3d) return;
      heroSection.addEventListener('mousemove', (e) => {
        const rect = heroSection.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width - 0.5) * 12;
        const y = -((e.clientY - rect.top) / rect.height - 0.5) * 12;
        card3d.style.transform = `perspective(1100px) rotateX(${y}deg) rotateY(${x}deg)`;
      });
      heroSection.addEventListener('mouseleave', () => {
        card3d.style.transform = 'perspective(1100px) rotateX(0deg) rotateY(0deg)';
      });
    }
